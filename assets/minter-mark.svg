<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Minter mark</title>
  <desc id="desc">A mint-green M under a flat top-view crystal whose point aims at its inner V.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Flat top-down crystal: no cube perspective, bottom point aimed at the M's inner V. -->
  <path d="M256 76 392 170 256 264 120 170Z" fill="#0F172A" stroke="url(#mint)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M256 76 392 170 256 264 120 170Z" fill="url(#mint)" opacity="0.09"/>
  <path d="M256 76V264" fill="none" stroke="url(#mint)" stroke-width="2" opacity="0.22"/>

  <g filter="url(#glow)" opacity="0.45">
    <path d="M164 340V214L256 304 348 214V340" fill="none" stroke="url(#mint)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M164 340V214L256 304 348 214V340" fill="none" stroke="url(#mint)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M164 326V222L256 304 348 222V326" fill="none" stroke="#ECFEFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>

  <circle cx="256" cy="84" r="5" fill="#A7F3D0"/>
</svg>
