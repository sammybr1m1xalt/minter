<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Minter mark</title>
  <desc id="desc">A mint-green M inside the cube front view below its top face, with the original small lemon-green crystal at the cube top vertex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Cube stays; only the two top-face edges aimed at the M's V are removed. -->
  <path d="M256 80 398 164 398 348 256 432 114 348 114 164Z" fill="#0F172A" stroke="#243247" stroke-width="3"/>
  <path d="M256 74 392 168 256 276 120 168Z" fill="#3DDC97" opacity="0.07"/>

  <g filter="url(#glow)" opacity="0.45">
    <path d="M164 340V204L256 304 348 204V340" fill="none" stroke="url(#mint)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M164 340V204L256 304 348 204V340" fill="none" stroke="url(#mint)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M164 326V212L256 304 348 212V326" fill="none" stroke="#ECFEFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>

  <!-- Small sky-facing crystal at the cube's top vertex. -->
  <circle cx="256" cy="76" r="28" fill="#A3E635" opacity="0.12"/>
  <rect x="247" y="67" width="18" height="18" rx="3" transform="rotate(45 256 76)" fill="#A3E635" stroke="#BEF264" stroke-width="2"/>
</svg>
