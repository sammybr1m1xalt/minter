<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">Minter logo</title>
  <desc id="desc">Minter wordmark with a dark cube, lowered M and lemon-green sky-facing crystal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="200" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="696" height="176" rx="32" fill="none" stroke="#1E293B" stroke-width="2"/>

  <g transform="translate(18 18) scale(0.32)">
    <!-- Cube stays; only the two top-face edges aimed at the M's V are removed. -->
    <path d="M256 80 398 164 398 348 256 432 114 348 114 164Z" fill="#0F172A" stroke="#243247" stroke-width="3"/>
    <path d="M256 74 392 168 256 276 120 168Z" fill="#3DDC97" opacity="0.07"/>
    <g filter="url(#glow)" opacity="0.45">
      <path d="M164 420V284L256 384 348 284V420" fill="none" stroke="url(#mint)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M164 420V284L256 384 348 284V420" fill="none" stroke="url(#mint)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 406V292L256 384 348 292V406" fill="none" stroke="#ECFEFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
    <!-- Enlarged top-view crystal, flat to the sky; its lower point aims at the M's V. -->
    <path d="M256 104 306 150 256 196 206 150Z" fill="#A3E635"/>
    <path d="M256 104 306 150 256 196 206 150Z" fill="none" stroke="#BEF264" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <text x="196" y="88" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" font-weight="700" letter-spacing="4">MINTER</text>
  <text x="198" y="121" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1">on-chain mint automation</text>
  <rect x="198" y="140" width="132" height="3" rx="1.5" fill="url(#mint)"/>
</svg>
