<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 720 200" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Minter logo</title>
  <desc id="desc">Minter wordmark with an aqua cube, widened M and chain on its centre seam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="720" height="200" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="696" height="176" rx="32" fill="none" stroke="#1E293B" stroke-width="2"/>

  <g transform="translate(18 18) scale(0.32)">
    <!-- Cube stays; only the two top-face edges aimed at the M's V are removed. -->
    <g filter="url(#softShadow)">
    <path d="M256 80 398 164 398 348 256 432 114 348 114 164Z" fill="#0C4A6E" stroke="#38BDF8" stroke-width="3"/>
      <path d="M114 164 256 248 256 432 114 348Z" fill="url(#faceL)"/>
      <path d="M256 248 398 164 398 348 256 432Z" fill="url(#faceR)"/>
      <path d="M256 80 398 164 256 248 114 164Z" fill="url(#faceTop)"/>
    </g>
    <!-- Chain motif in the cube top face -->
    <!-- Chain centred on the cube seam that bisects the M V -->
    <g fill="none" stroke="url(#mint)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="244" y="214" width="12" height="34" rx="6"/>
      <rect x="254" y="214" width="12" height="34" rx="6"/>
      <rect x="244" y="242" width="12" height="34" rx="6"/>
      <rect x="254" y="242" width="12" height="34" rx="6"/>
      <rect x="244" y="270" width="12" height="34" rx="6"/>
      <rect x="254" y="270" width="12" height="34" rx="6"/>
    </g>

    <g filter="url(#glow)" opacity="0.45">
      <path d="M166 344V230L256 316 346 230V344" fill="none" stroke="url(#mint)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M166 344V230L256 316 346 230V344" fill="none" stroke="url(#mint)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166 330V240L256 316 346 240V330" fill="none" stroke="#ECFEFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
  </g>

  <text x="196" y="88" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" font-weight="700" letter-spacing="4">MINTER</text>
  <text x="198" y="121" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1">on-chain mint automation</text>
  <rect x="198" y="140" width="132" height="3" rx="1.5" fill="url(#mint)"/>
</svg>
